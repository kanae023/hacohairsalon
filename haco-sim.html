<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HACO ヘア出店シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: price-list sheet — thin rules, peach-shaded value columns, one orange accent (follows HACO i PRICE LIST 2026) */
:root{
  --bg:#ffffff; --ink:#1d1a19; --mute:#8b817d; --rule:#e7dfdb; --line:#1d1a19;
  --accent:#e2603a; --peach:#fdf1eb; --peach-2:#fae3d8; --good:#2f7d5b; --bad:#c2412b;
  --f-latin:"Poppins","Helvetica Neue",Arial,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181515; --ink:#f1ebe8; --mute:#a49893; --rule:#3a3331; --line:#f1ebe8;
  --accent:#f07a52; --peach:#2a201c; --peach-2:#3a2a23; --good:#5cc495; --bad:#ff7b62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181515; --ink:#f1ebe8; --mute:#a49893; --rule:#3a3331; --line:#f1ebe8;
  --accent:#f07a52; --peach:#2a201c; --peach-2:#3a2a23; --good:#5cc495; --bad:#ff7b62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:14px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-latin);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--f-latin);font-weight:400;font-size:30px;letter-spacing:.32em;line-height:1}
.brand i{font-style:normal;color:var(--accent)}
.brand-sub{font-size:11px;color:var(--mute);margin-top:6px}
.doc{text-align:right}
.doc b{font-family:var(--f-latin);font-weight:500;letter-spacing:.22em;font-size:13px}
.doc span{display:block;font-size:11px;color:var(--mute)}
h1{font-size:20px;font-weight:700;margin:26px 0 4px;text-wrap:balance}
.lead{color:var(--mute);font-size:12.5px;margin:0 0 18px;max-width:70ch}
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 0 10px}
.sec::before{content:"";width:22px;height:2px;background:var(--accent);align-self:center}
.sec b{font-family:var(--f-latin);font-weight:500;letter-spacing:.2em;font-size:13px}
.sec span{font-size:11.5px;color:var(--mute)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:500 12px var(--f-latin);letter-spacing:.18em;padding:9px 18px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.mixbox[hidden]{display:none}
.mixbox{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-left:6px}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--peach);color:var(--accent)}
.tab:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.inputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.field{background:var(--peach);border:1px solid var(--peach-2);border-radius:8px;padding:12px 14px;min-width:0}
.field label{display:block;font:500 10.5px var(--f-latin);letter-spacing:.16em;color:var(--ink)}
.field label small{font-family:var(--f-ja);letter-spacing:0;color:var(--mute);font-weight:400;margin-left:4px}
.field .in{display:flex;align-items:baseline;gap:4px;margin-top:6px}
.field input{width:100%;min-width:0;border:0;border-bottom:1px solid var(--peach-2);background:transparent;color:var(--ink);font:400 22px var(--f-latin);font-variant-numeric:tabular-nums;padding:2px 0}
.field .u{font-size:12px;color:var(--mute);white-space:nowrap}
.field .hint{font-size:10.5px;color:var(--mute);margin-top:4px}

.result{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:4px}
.kpi{padding:16px 14px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--rule)}
.kpi .k{font-size:11px;color:var(--mute)}
.kpi .v{font:300 30px var(--f-latin);font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.kpi.main{background:var(--peach)}
.kpi.main .v{color:var(--accent);font-weight:400}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;margin-left:6px;vertical-align:middle}
.pill.ok{color:var(--good)} .pill.ng{color:var(--bad)}

.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:16px 0 6px;background:var(--rule)}
.bar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font:500 10.5px var(--f-latin);letter-spacing:.14em;color:var(--mute);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
th.acc{color:var(--accent)}
td{padding:11px 10px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:middle}
td:first-child{text-align:left}
td .ja{font-weight:500;font-size:14px}
td .en{display:block;font:400 9.5px var(--f-latin);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
td.sh{background:var(--peach)}
td.amt{font-size:15px}
td.amt.acc{color:var(--accent)}
.pct{width:64px;text-align:right;border:1px solid var(--peach-2);border-radius:4px;background:var(--bg);color:var(--ink);font:400 14px var(--f-latin);padding:3px 6px}
.flag{font-size:11px;margin-left:6px}
.flag.ng{color:var(--bad)} .flag.ok{color:var(--good)}
tr.tot td{border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);font-weight:700}
tr.profit td{background:var(--peach-2);font-weight:700}
tr.profit td.amt{color:var(--accent);font-size:17px}
.note{margin-top:22px;background:var(--peach);border:1px solid var(--peach-2);border-radius:8px;padding:14px 16px}
.note b{font:500 11px var(--f-latin);letter-spacing:.18em;color:var(--accent)}
.note ul{margin:6px 0 0;padding-left:1.1em;font-size:12px;color:var(--ink)}
.reset{font-size:11.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.pin{width:74px;text-align:right;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);font:400 14px var(--f-latin);font-variant-numeric:tabular-nums;padding:4px 7px}
.pin::placeholder{color:var(--mute);opacity:.6}
.act{width:118px;text-align:right;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);font:400 14px var(--f-latin);font-variant-numeric:tabular-nums;padding:4px 7px}
.act::placeholder{color:var(--mute);opacity:.6}
td.diff{font-size:12.5px;white-space:nowrap}
td.diff.ng{color:var(--bad)} td.diff.ok{color:var(--good)}
th.grp{border-bottom:0;padding-bottom:0;font-size:10px}
tr.sub td{font-size:12.5px;color:var(--mute)}
.tools{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11.5px;color:var(--mute)}
.bench{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;display:grid;gap:12px}
.bin{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12.5px;color:var(--mute)}
.bin label{display:flex;flex-direction:column;gap:4px}
.in2{display:flex;align-items:center;gap:5px;color:var(--ink)}
.pin.wide{width:96px}
.bline{font-size:12.5px;color:var(--mute)}
.bline b{color:var(--ink);font-weight:500}
.bout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{background:var(--peach);border:1px solid var(--peach-2);border-radius:8px;padding:12px 14px;min-width:0}
.bcard .k{font-size:11.5px;color:var(--mute)}
.bcard .v{font:300 26px var(--f-latin);font-variant-numeric:tabular-nums;color:var(--accent);margin-top:2px}
.bcard .s{font-size:11.5px;color:var(--mute)}
.use{margin-top:8px;font-size:11.5px;border:1px solid var(--accent);color:var(--accent);background:var(--bg);border-radius:5px;padding:4px 10px;cursor:pointer}
@media (max-width:520px){.bout{grid-template-columns:1fr}}
.toggles{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px}
.lang{display:flex;width:max-content;border:1px solid var(--rule);border-radius:99px;overflow:hidden;margin-bottom:0}
.lang button{border:0;background:var(--bg);color:var(--mute);font:500 11px var(--f-latin);letter-spacing:.1em;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--peach);color:var(--accent)}
.plan{display:grid;gap:12px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--peach);border:1px solid var(--peach-2);border-radius:8px;padding:12px 16px}
.rec .k{font-size:11.5px;color:var(--mute)}
.rec .v{font:300 30px var(--f-latin);color:var(--accent);line-height:1.2}
.rec .s{font-size:11.5px;color:var(--mute)}
.stage{min-width:520px}
.stage td{font-size:14px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--mute)}
footer span:last-child{font-family:var(--f-latin);letter-spacing:.2em}

@media (max-width:760px){
  .inputs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .result{grid-template-columns:1fr}
  .kpi+.kpi{border-left:0;border-top:1px solid var(--rule)}
}
@media (max-width:380px){.inputs{grid-template-columns:1fr}}
</style>
<style>
.inputs{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;font-size:12px;padding:6px 0;border:1px solid var(--peach-2);background:var(--bg);color:var(--ink);border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.util{width:100%;border-collapse:collapse;min-width:0}
.util th,.util td{text-align:center}
.util th:first-child,.util td:first-child{text-align:left}
.util td.pick{cursor:pointer}
.util .col-on{background:var(--peach)}
#utilTables{display:grid;gap:14px}
.util{table-layout:fixed}
.util th:first-child{width:22%}
.seg button{font-size:11px;padding:6px 2px;white-space:nowrap}
.util tr.big td{font:300 19px var(--f-latin);font-variant-numeric:tabular-nums;color:var(--ink)}
.util tr.big td.col-on{color:var(--accent)}
.util .radio{font-size:11.5px;border:1px solid var(--rule);border-radius:99px;padding:3px 12px;background:var(--bg);color:var(--mute);cursor:pointer}
.util .radio[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--peach)}
.premise{font-size:11.5px;color:var(--mute);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.roy{width:56px}
@media (max-width:760px){.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">HACO</div><div class="brand-sub">Brand License Program</div></div>
    <div class="doc">
      <div class="toggles"><div class="lang" role="group" aria-label="Language"><button id="l-ja" data-l="ja" aria-pressed="true">日本語</button><button id="l-ko" data-l="ko" aria-pressed="false">한국어</button></div></div>
      <b>HAIR STORE SIMULATOR 2026</b><span data-t="docsub"></span></div>
  </header>

  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="sec"><b>INPUT</b><span data-t="inputSub"></span></div>
  <div class="inputs">
    <div class="field"><label for="rent">RENT<small data-t="rent"></small></label>
      <div class="in"><span class="u cur"></span><input id="rent" inputmode="numeric"></div><div class="hint" data-t="rentHint"></div></div>
    <div class="field"><label for="seats">SEATS<small data-t="seats"></small></label>
      <div class="in"><input id="seats" inputmode="numeric" value="6"><span class="u" data-t="seatU"></span></div><div class="hint" data-t="seatsHint"></div></div>
    <div class="field"><label for="price">PRICE<small data-t="price"></small></label>
      <div class="in"><span class="u cur"></span><input id="price" inputmode="numeric"></div><div class="hint" data-t="priceHint"></div></div>
    <div class="field"><label for="hours">HOURS<small data-t="hours"></small></label>
      <div class="in"><input id="hours" inputmode="decimal" value="8"><span class="u" data-t="hourU"></span></div><div class="hint" data-t="hoursHint"></div></div>
    <div class="field"><label>DAYS<small data-t="days"></small></label>
      <div class="seg" role="group">
        <button id="d30" data-d="30" aria-pressed="false" data-t="d30"></button>
        <button id="d26" data-d="26" aria-pressed="true" data-t="d26"></button>
        <button id="d22" data-d="22" aria-pressed="false" data-t="d22"></button>
      </div><div class="hint" id="dayshint"></div></div>
  </div>

  <div class="premise"><span data-t="rate1"></span> <input class="pin" id="rate" inputmode="decimal" value="8.45" aria-label="rate"> <span data-t="rate2"></span></div>

  <div class="sec"><b>SEAT</b><span data-t="seatSub"></span></div>
  <div id="utilTables"></div>
  <div class="premise"><span data-t="prem1"></span> <input class="pin" id="ttime" inputmode="decimal" value="2" aria-label="time"> <span data-t="prem2"></span></div>

  <div class="sec"><b>PLAN</b><span data-t="planSub"></span></div>
  <div class="plan">
    <div class="rec"><div><div class="k" data-t="recK"></div><div class="v num" id="recSeats"></div><div class="s" id="recS"></div></div><button class="use" id="useRec" data-t="useRec"></button></div>
    <div class="tblwrap"><table class="stage">
      <thead><tr><th data-t="stStage"></th><th data-t="util"></th><th id="stSalesH"></th><th data-t="stProfit"></th><th data-t="stJudge"></th></tr></thead>
      <tbody id="stageRows"></tbody>
    </table></div>
  </div>

  <div class="sec"><b>RESULT</b><span><span data-t="resultSub"></span> <span class="num" id="k-sales"></span>（<span id="k-sales-s"></span>）</span></div>
  <div class="result" style="grid-template-columns:1fr 1fr">
    <div class="kpi main"><div class="k" data-t="kpiA"></div><div class="v num" id="k-profit"></div><div class="s" id="k-margin"></div></div>
    <div class="kpi"><div class="k" data-t="kpiT"></div><div class="v num" id="k-tprofit"></div><div class="s" id="k-tmargin"></div></div>
  </div>

  <div class="sec"><b>COST</b><span data-t="costSub"></span></div>
  <div class="tblwrap">
    <table>
      <thead><tr><th>ITEM</th><th class="acc" data-t="thT"></th><th data-t="thMy"></th><th data-t="thTA"></th><th data-t="thA"></th><th data-t="thD"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="tools"><span id="filled"></span><button class="reset" id="reset" data-t="reset"></button></div>

  <div class="note">
    <b>NOTE</b>
    <ul><li data-t="n1"></li><li data-t="n2"></li><li data-t="n3"></li><li data-t="n4"></li></ul>
  </div>
  <footer><span data-t="foot"></span><span>HACO</span></footer>
</div>

<script>
const T={
ja:{docsub:"ブランドライセンス出店用 / 税別概算",planSub:"席数の目安 ／ 目標の稼働率70%で月売上が家賃の10倍になる席数",recK:"おすすめの席数",recS:"稼働率70%で月売上 {s}（家賃の10倍）に届く席数",useRec:"この席数で計算する",stStage:"段階",stSales:"月売上（{n}席）",stProfit:"営業利益（目安）",stJudge:"チェック",st1:"半年後",st2:"1年後",st3:"目標",j1:"赤字にならない",j2:"利益が出る",j3:"利益10%",ng:"届かない",h1:"ヘアサロン 出店収支シミュレーション（月）",
lead:"家賃・席数・客単価・営業時間を入れると、1席の売上目安と月の収支が出ます。加盟店目安は営業利益10%を確保する配分です。",
inputSub:"ピンクの枠に入力",rate1:"為替レート 1円 =",rate2:"ウォン ／ 日本語は円、韓国語はウォンで表示され、切り替えるとこのレートで換算されます",rent:"家賃（月）",rentHint:"共益費込み",seats:"席数",seatU:"席",seatsHint:"セット面の数",price:"客単価",priceHint:"税別",
hours:"営業時間",hourU:"時間",hoursHint:"1日あたり",days:"営業日",d30:"無休",d26:"週1定休",d22:"週2定休",dayN:"月{n}日",
seatSub:"1席の売上目安 ／ 使う稼働率を選んでください",util:"稼働率",custDay:"1席1日の客数",salesDay:"1席1日の売上",salesMonth:"1席の月売上",person:"人",
prem1:"1人あたりの施術時間",prem2:"時間で計算 ／ 稼働率は予約が埋まっている割合",
resultSub:"月の収支 ／ 月売上",kpiA:"営業利益（自店の数字）",kpiT:"営業利益（加盟店目安どおり）",margin:"利益率",plus:"黒字",minus:"赤字",
salesS:"{s}席 × 1席 {p}・稼働率{u}%・{d}",
costSub:"ピンクの列が加盟店目安。白い欄に自店の％か金額を入力",thT:"加盟店目安 %",thMy:"自店の %",thTA:"目安額（月）",thA:"自店の金額（月）",thD:"目安との差",
items:["人件費","材料費","店販仕入","広告費","水道光熱費","固定費（通信・システム等）","消耗品・雑費","保険料・税金","教育・研修","その他"],
insSub:"雇用 5% ／ 業務委託 2%",rentRow:"家賃",roy:"ブランドライセンス料",tot:"経費合計",pro:"営業利益",max:"家賃の上限目安",maxSub:"この売上で家賃10%に収まる金額",
inp:"入力",filled:"自店の数字：{n} / {m} 項目入力済み（空欄は目安で計算）",reset:"自店の数字をすべて消す",
n1:"保険料・税金は、雇用なら社会保険などの会社負担を含めて5%、業務委託なら店舗の保険と税金だけで2%が目安です。",
n2:"ブランドライセンス料は店舗ごとの契約で決まります。初期値は3%なので、契約の料率に書き換えてください。",
n3:"融資の返済は経費に入れず、営業利益の中から支払います。返済額を引いても手元にお金が残るか確認してください。",
n4:"入力した数字はこのブラウザにだけ保存されます。",foot:"加盟検討用・参考資料（実際の収支を保証するものではありません）"},

hours:"영업시간",hourU:"시간",hoursHint:"1일 기준",days:"영업일",d30:"연중무휴",d26:"주 1회 휴무",d22:"주 2회 휴무",dayN:"월 {n}일",
seatSub:"좌석당 매출 기준 / 사용할 가동률을 선택하세요",util:"가동률",custDay:"좌석당 1일 고객 수",salesDay:"좌석당 1일 매출",salesMonth:"좌석당 월 매출",person:"명",

items:["인건비","재료비","판매 상품 매입","광고비","수도광열비","고정비 (통신·시스템 등)","소모품·잡비","보험료·세금","교육·연수","기타"],
insSub:"고용 5% / 업무위탁 2%",rentRow:"임대료",roy:"브랜드 라이선스료",tot:"경비 합계",pro:"영업이익",max:"임대료 상한 기준",maxSub:"이 매출에서 임대료가 10%가 되는 금액",
inp:"입력",filled:"우리 매장 수치: {n} / {m} 항목 입력됨 (빈칸은 기준으로 계산)",reset:"우리 매장 수치 모두 지우기",
n1:"보험료·세금은 고용의 경우 4대보험 등 회사 부담분을 포함해 5%, 업무위탁의 경우 매장 보험과 세금만으로 2%가 기준입니다.",
n2:"브랜드 라이선스료는 매장별 계약으로 정해집니다. 초기값은 3%이므로 계약된 요율로 수정해 주세요.",
n3:"대출 상환금은 경비에 넣지 않고 영업이익에서 지불합니다. 상환액을 빼도 자금이 남는지 확인해 주세요.",
n4:"입력한 수치는 이 브라우저에만 저장됩니다.",foot:"가맹 검토용 참고 자료 (실제 수지를 보장하지 않습니다)"}};
const EN=["Staff","Materials","Retail stock","Marketing","Utilities","Fixed","Sundries","","Education","Other"];
const PCT=[48,9,1,7,2,1,1,5,2,1];
const RENT_PCT=10,UTILS=[20,30,40,50,60,70,80,90];
let CURR="jpy";
let LANG="ja",DAYS=26,UTIL=70,MODE={};
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=T[LANG][k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const CUR=()=>CURR==="krw"?"₩":"¥";
const loc=()=>LANG==="ko"?"ko-KR":"ja-JP";
const yen=n=>(n<0?"−":"")+CUR()+Math.round(Math.abs(n)).toLocaleString(loc());
const fmt=n=>Math.round(n).toLocaleString(loc());
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.\-]/g,""));return isNaN(n)?0:n};
const has=v=>String(v).replace(/[^\d.]/g,"")!=="";
const pf=n=>(Math.round(n*10)/10).toFixed(1)+"%";
const pt=n=>(n>0?"+":n<0?"−":"±")+(Math.round(Math.abs(n)*10)/10).toFixed(1)+"pt";
const KEY="haco-hair-sim-v7",TOP=["rent","seats","price","hours","ttime","rate"];
function store(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{const o={top:TOP.map(id=>$(id).value),days:DAYS,util:UTIL,roy:$("roy").value,mode:MODE,act:{},pct:{}};
  document.querySelectorAll(".act").forEach(e=>o.act[e.dataset.i]=e.value);document.querySelectorAll(".pin[data-i]").forEach(e=>o.pct[e.dataset.i]=e.value);
  o.curr=CURR;o.lang=LANG;localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}

function build(sv){
  const g=(k,f)=>(sv&&sv[f]&&sv[f][k])||"";let h="";
  const row=(key,ja,en,tg,my,act)=>`<tr><td><span class="ja">${ja}</span><span class="en">${en}</span></td><td class="sh num">${tg}</td><td class="num">${my}</td><td class="amt num" id="t-${key}"></td><td>${act}</td><td class="diff num" id="d-${key}"></td></tr>`;
  t("items").forEach((nm,i)=>{h+=row(i,nm,i===7?t("insSub"):EN[i],pf(PCT[i]),
    `<input class="pin" id="pct-${i}" data-i="${i}" inputmode="decimal" placeholder="%" aria-label="${nm} %" value="${g(i,"pct")}">`,
    `<input class="act" id="act-${i}" data-i="${i}" inputmode="numeric" placeholder="${CUR()} ${t("inp")}" aria-label="${nm}" value="${g(i,"act")}">`)});
  h+=row("rent",t("rentRow"),"Rent",pf(RENT_PCT),'<span id="r-rent"></span>','<span class="num" id="a-rent"></span>');
  h+=row("roy",t("roy"),"Royalty",`<input class="pin roy" id="roy" inputmode="decimal" value="${(sv&&sv.roy)||3}" aria-label="Royalty %">`,'<span id="r-roy"></span>','<span class="num" id="a-roy"></span>');
  h+=`<tr class="tot"><td>${t("tot")}</td><td class="sh num" id="p-tot"></td><td class="num" id="r-tot"></td><td class="amt num" id="t-tot"></td><td class="amt num" id="a-tot"></td><td class="diff num" id="d-tot"></td></tr>
  <tr class="profit"><td>${t("pro")}</td><td class="num" id="p-pro"></td><td class="num" id="r-pro"></td><td class="amt num" id="t-pro"></td><td class="amt num" id="a-pro"></td><td class="diff num" id="d-pro"></td></tr>
  <tr><td><span class="ja">${t("max")}</span><span class="en">${t("maxSub")}</span></td><td class="sh"></td><td></td><td class="amt num acc" id="t-max"></td><td></td><td></td></tr>`;
  $("rows").innerHTML=h;
  document.querySelectorAll(".act").forEach(e=>{e.addEventListener("input",()=>{MODE[e.dataset.i]="yen";calc();save()});
    e.addEventListener("blur",()=>{if(has(e.value))e.value=fmt(num(e.value))})});
  document.querySelectorAll(".pin[data-i]").forEach(e=>e.addEventListener("input",()=>{MODE[e.dataset.i]="pct";calc();save()}));
  $("roy").addEventListener("input",()=>{calc();save()});
}
function setDiff(id,d,inv){const e=$(id);if(d===null){e.textContent="—";e.className="diff num";return}
  const bad=inv?d<-0.05:d>0.05,good=inv?d>0.05:d<-0.05;e.textContent=pt(d);e.className="diff num"+(bad?" ng":good?" ok":"")}
function seat(){
  const h=num($("hours").value),p=num($("price").value),tt=num($("ttime").value);const out={};
  const cell=u=>{const c=tt?h/tt*u/100:0,d=c*p;out[u]=d*DAYS;return{c,d,m:d*DAYS}};
  const tbl=us=>{const v=us.map(cell);const on=u=>u===UTIL?' class="col-on"':'';
    return `<div class="tblwrap"><table class="util"><thead><tr><th>${t("util")}</th>${us.map(u=>`<th${on(u)}><button class="radio" data-u="${u}" aria-pressed="${u===UTIL}">${u}%</button></th>`).join("")}</tr></thead><tbody>
    <tr><td>${t("custDay")}</td>${us.map((u,i)=>`<td class="num${u===UTIL?" col-on":""}">${(Math.round(v[i].c*10)/10).toFixed(1)}${t("person")}</td>`).join("")}</tr>
    <tr><td>${t("salesDay")}</td>${us.map((u,i)=>`<td class="num${u===UTIL?" col-on":""}">${yen(v[i].d)}</td>`).join("")}</tr>
    <tr class="big"><td style="font:500 13px var(--f-ja)">${t("salesMonth")}</td>${us.map((u,i)=>`<td${on(u)}>${yen(v[i].m)}</td>`).join("")}</tr></tbody></table></div>`};
  $("utilTables").innerHTML=tbl(UTILS.slice(0,4))+tbl(UTILS.slice(4));
  document.querySelectorAll(".radio").forEach(b=>b.addEventListener("click",()=>{UTIL=+b.dataset.u;calc();save()}));
  return out[UTIL];
}
function plan(){
  const h=num($("hours").value),p=num($("price").value),tt=num($("ttime").value),rent=num($("rent").value),seats=num($("seats").value),roy=num($("roy").value);
  const perSeat=u=>tt?h/tt*u/100*p*DAYS:0;
  const goal=rent*10,ps70=perSeat(70);const rec=ps70?Math.ceil(goal/ps70):0;
  $("recSeats").textContent=rec?rec+t("seatU"):"—";$("recS").textContent=t("recS",{s:yen(goal)});
  $("stSalesH").textContent=t("stSales",{n:seats});
  const vp=PCT.reduce((a,b)=>a+b,0)+roy;
  const rows=[["st1",35,"j1",0],["st2",55,"j2",0.0001],["st3",70,"j3",0.0999]];
  $("stageRows").innerHTML=rows.map(([k,u,j,th])=>{const sales=perSeat(u)*seats,pro=sales*(1-vp/100)-rent,ok=sales>0&&pro/sales>=th&&pro>=0;
    return `<tr><td>${t(k)}</td><td class="num">${u}%</td><td class="num">${yen(sales)}</td><td class="num" style="color:${pro<0?"var(--bad)":"inherit"}">${yen(pro)}</td><td>${ok?`<span class="pill ok">${t(j)}</span>`:`<span class="pill ng">${t(j)}：${t("ng")}</span>`}</td></tr>`}).join("");
}
function calc(){
  const per=seat(),seats=num($("seats").value),rent=num($("rent").value),roy=num($("roy").value);
  const sales=seats*per,S=sales||1;let tTot=0,aTot=0,vp=0,filled=0;
  PCT.forEach((pc,i)=>{const tv=sales*pc/100;vp+=pc;tTot+=tv;
    const ae=$("act-"+i),pe=$("pct-"+i);let a=tv,en=false;
    if(MODE[i]==="pct"&&has(pe.value)){a=sales*num(pe.value)/100;ae.value=fmt(a);en=true}
    else if(MODE[i]==="pct"){ae.value=""}
    else if(has(ae.value)){a=num(ae.value);if(document.activeElement!==pe)pe.value=sales?Math.round(a/S*1000)/10:"";en=true}
    else if(document.activeElement!==pe){pe.value=""}
    if(en)filled++;aTot+=a;$("t-"+i).textContent=yen(tv);setDiff("d-"+i,en&&sales?a/S*100-pc:null)});
  const tR=sales*RENT_PCT/100;tTot+=tR;aTot+=rent;
  $("t-rent").textContent=yen(tR);$("a-rent").textContent=yen(rent);$("r-rent").textContent=sales?pf(rent/S*100):"—";setDiff("d-rent",sales?rent/S*100-RENT_PCT:null);
  const rA=sales*roy/100;tTot+=rA;aTot+=rA;
  $("t-roy").textContent=yen(rA);$("a-roy").textContent=yen(rA);$("r-roy").textContent=pf(roy);$("d-roy").textContent="—";
  const tp=vp+RENT_PCT+roy;
  $("p-tot").textContent=pf(tp);$("t-tot").textContent=yen(tTot);$("a-tot").textContent=yen(aTot);$("r-tot").textContent=sales?pf(aTot/S*100):"—";setDiff("d-tot",sales?aTot/S*100-tp:null);
  const tP=sales-tTot,aP=sales-aTot;
  $("p-pro").textContent=pf(100-tp);$("t-pro").textContent=yen(tP);$("a-pro").textContent=yen(aP);$("r-pro").textContent=sales?pf(aP/S*100):"—";setDiff("d-pro",sales?aP/S*100-(100-tp):null,true);
  $("t-max").textContent=yen(tR);
  $("filled").textContent=t("filled",{n:filled,m:PCT.length});
  const pill=v=>v>=0?`<span class="pill ok">${t("plus")}</span>`:`<span class="pill ng">${t("minus")}</span>`;
  $("k-profit").textContent=yen(aP);$("k-margin").innerHTML=sales?`${t("margin")} ${pf(aP/S*100)}${pill(aP)}`:"—";
  $("k-tprofit").textContent=yen(tP);$("k-tmargin").textContent=sales?`${t("margin")} ${pf(tP/S*100)}`:"—";
  plan();
  $("k-sales").textContent=yen(sales);$("k-sales-s").textContent=t("salesS",{s:seats,p:yen(per),u:UTIL,d:t("d"+DAYS)});
}
function setDays(d){DAYS=d;document.querySelectorAll("[data-d]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.d===d));$("dayshint").textContent=t("dayN",{n:d})}
function applyText(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===LANG));
  document.querySelectorAll("[data-c]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===CURR));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll(".cur").forEach(e=>e.textContent=CUR());
}
function snapshot(){const o={roy:$("roy")?$("roy").value:3,act:{},pct:{}};
  document.querySelectorAll(".act").forEach(e=>o.act[e.dataset.i]=e.value);document.querySelectorAll(".pin[data-i]").forEach(e=>o.pct[e.dataset.i]=e.value);return o}
function setLang(l){LANG=l;const c=l==="ko"?"krw":"jpy";if(c!==CURR){setCurr(c)}const sv=snapshot();applyText();setDays(DAYS);build(sv);calc()}
function setCurr(c){
  if(c===CURR)return;const r=num($("rate").value)||1;const f=c==="krw"?r:1/r;
  const conv=e=>{if(has(e.value))e.value=fmt(num(e.value)*f)};
  conv($("rent"));conv($("price"));document.querySelectorAll(".act").forEach(conv);
  CURR=c;const sv=snapshot();applyText();build(sv);calc();
}
document.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>{setLang(b.dataset.l);save()}));

document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{setDays(+b.dataset.d);calc();save()}));
TOP.forEach(id=>{$(id).addEventListener("input",()=>{calc();save()});
  if(id==="rent"||id==="price")$(id).addEventListener("blur",e=>e.target.value=fmt(num(e.target.value)))});
$("useRec").addEventListener("click",()=>{const n=parseInt($("recSeats").textContent);if(n){$("seats").value=n;calc();save()}});
$("reset").addEventListener("click",()=>{document.querySelectorAll(".act,.pin[data-i]").forEach(e=>e.value="");MODE={};calc();save()});
(function init(){const sv=store();
  if(sv.top){TOP.forEach((id,i)=>{if(sv.top[i]!=null)$(id).value=sv.top[i]});DAYS=sv.days||26;UTIL=sv.util||70;MODE=sv.mode||{};CURR=sv.curr||"jpy";LANG=sv.lang||"ja"}
  else{$("rent").value=fmt(600000);$("price").value=fmt(10000)}
  applyText();setDays(DAYS);build(sv.top?sv:null);calc()})();
</script>
